<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn UI screenshots into editable React and Tailwind components. Compare your reference, refine the code, and preview the result in PixelForge." />
    <script>
      // Apply the saved theme before the first paint; storage may be unavailable.
      try {
        const preference = localStorage.getItem('pixelforge-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
    <title>PixelForge AI — Screenshot to Code</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
